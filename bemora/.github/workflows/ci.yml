name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      # NOTE: the library itself supports Node >= 18 (see engines), but the
      # vitest 4 test runner requires Node 20+ (node:util styleText).
      matrix:
        node-version: ['20', '22']
    defaults:
      run:
        working-directory: bemora

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: bemora/pnpm-lock.yaml

      # bemora/ is intentionally excluded from the root pnpm workspace,
      # so its deps must be installed from inside bemora/ itself.
      - name: Install dependencies
        run: pnpm install --ignore-workspace

      - name: Lint (node --check over src/examples/tests)
        run: pnpm run lint

      - name: Typecheck (.d.ts + JS parse)
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run integration tests
        run: pnpm run test:integration
        env:
          # Integration tests run in no-key mode; keys are only needed
          # for provider-specific integration tests that should be opt-in.
          BEMORA_LOG_LEVEL: silent

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bemora
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: bemora/pnpm-lock.yaml
      - run: pnpm install --ignore-workspace
      # Scoped to bemora's own tree: the root workspace's dev tooling
      # (orval/vite chains in lib/, artifacts/) is not shipped and must not
      # gate this package. --prod drops dev-only findings (vitest/vite).
      - name: pnpm audit
        run: pnpm audit --ignore-workspace --prod --audit-level=high

  license-check:
    name: License Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bemora
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: bemora/pnpm-lock.yaml
      - run: pnpm install --ignore-workspace
      - name: Install license checker
        run: npm install -g license-checker
      - name: Check licenses (allow MIT, Apache-2.0, BSD-*, ISC, CC0-1.0, 0BSD, Python-2.0, Unlicense)
        run: |
          license-checker --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;CC0-1.0;0BSD;Python-2.0;Unlicense;CC-BY-4.0;BlueOak-1.0.0" \
            --excludePackages "bemora-enterprise"
