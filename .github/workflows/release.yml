name: Release

# Publishes bemora to npm whenever a GitHub Release is published.
# Prereleases (alpha/beta) go out under the `alpha` tag; full releases
# update `latest`. One-time setup: add NPM_TOKEN (automation token) at
# Settings → Secrets and variables → Actions → New repository secret.

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish bemora to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bemora
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: bemora/pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --ignore-workspace

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test

      - name: Publish to npm
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            TAG=alpha
          else
            TAG=latest
          fi
          pnpm publish --tag "$TAG" --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
