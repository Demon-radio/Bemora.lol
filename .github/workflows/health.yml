name: Provider Health

# Daily probe of every keyless provider through the real Bemora pipeline.
# Reports via an issue when endpoints are degraded/dead — this catches the
# "free API died overnight" problem before users do.

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    name: Probe keyless providers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bemora
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: bemora/pnpm-lock.yaml

      - run: pnpm install --ignore-workspace

      - name: Run health check
        run: node scripts/health-check.mjs

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: bemora/health-report.json

      - name: File or update provider-health issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('bemora/health-report.json', 'utf8'));
            const bad = report.providers.filter(p => p.status === 'DEAD' || p.status === 'DEGRADED' || p.status === 'UNKNOWN');
            const title = 'Provider health status (automated)';
            const stamp = report.checkedAt;
            const lines = bad.map(p =>
              `| \`${p.ns}\` | ${p.status} | \`${p.method ?? '-'}\` | ${String(p.error ?? '').replace(/\|/g, '\\|').slice(0, 90)} |`
            );
            const body = [
              `**Checked at:** ${stamp}`,
              `**Totals:** ${report.totals.ALIVE} alive · ${report.totals.DEGRADED} degraded · ${report.totals.DEAD} dead · ${report.totals.UNKNOWN} unknown (of ${report.keylessTotal} keyless, SKIP excluded)`,
              '',
              bad.length
                ? '| provider | status | method | error |\n|---|---|---|---|\n' + lines.join('\n')
                : 'All keyless providers are ALIVE. 🎉',
              '',
              '_Auto-generated by the Provider Health workflow. Edit samples in `scripts/health-check.mjs`._',
            ].join('\n');

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'provider-health',
              per_page: 100,
            });
            const current = existing.find(i => i.title === title);

            if (current && bad.length === 0) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: current.number, body });
            } else if (current) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: current.number, body });
            } else if (bad.length > 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['provider-health'],
                body,
              });
            }
